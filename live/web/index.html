<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101a17" />
    <title>场迹 · PitchTrace 3D | 足球直播观赛台</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #101815;
        color: #ecf2e9;
        font:
          15px/1.5 "PingFang SC",
          "Microsoft YaHei",
          Arial,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      select,
      summary,
      input[type="range"] {
        cursor: pointer;
      }
      button,
      select,
      input[type="url"] {
        border: 1px solid #405147;
        border-radius: 6px;
        background: #1c2923;
        color: inherit;
      }
      button {
        padding: 7px 13px;
      }
      button:hover,
      select:hover {
        border-color: #8da28f;
      }
      button[aria-pressed="true"],
      button.primary {
        background: #d1ed8b;
        color: #122216;
        border-color: #d1ed8b;
      }
      button:disabled,
      input:disabled,
      select:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid #def4aa;
        outline-offset: 3px;
      }
      header {
        border-bottom: 1px solid #35423a;
      }
      .wrap {
        width: min(1540px, 100%);
        margin: auto;
        padding-inline: clamp(14px, 3.8vw, 60px);
      }
      header .wrap {
        height: 66px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 20px;
        font-weight: 750;
      }
      .mark {
        width: 32px;
        height: 28px;
        border: 2px solid #cce78b;
        border-radius: 4px;
        display: grid;
        place-items: center;
        position: relative;
        transform: skew(-8deg);
      }
      .mark:before {
        content: "";
        position: absolute;
        border-left: 1px solid #cce78b;
        height: 100%;
      }
      .mark:after {
        content: "";
        border: 1px solid #cce78b;
        width: 9px;
        height: 9px;
        border-radius: 100%;
      }
      .en {
        color: #b5c5b8;
        font-size: 12px;
        letter-spacing: 0.12em;
      }
      .signal {
        font-size: 13px;
        color: #cde592;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .signal:before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      main.wrap {
        padding-block: 24px 32px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 268px;
        gap: 22px;
      }
      .field {
        position: relative;
        aspect-ratio: 16/9;
        background: #263b2d;
        overflow: hidden;
        border: 1px solid #465648;
        border-radius: 9px;
      }
      .field canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .field:fullscreen {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
        border: 0;
        border-radius: 0;
      }
      .overlay {
        position: absolute;
        pointer-events: none;
      }
      .label {
        top: 14px;
        left: 14px;
        padding: 4px 10px;
        background: #111d16de;
        color: #f0f3e9;
        border-left: 3px solid #d4ef91;
        border-radius: 3px;
        font-size: 12px;
      }
      .full {
        position: absolute;
        top: 12px;
        right: 12px;
        background: #15231cde;
        color: #f3f8eb;
        border-color: #78907b;
        font-size: 12px;
      }
      .caption {
        bottom: 14px;
        left: 14px;
        background: #121e15e3;
        border-radius: 5px;
        padding: 5px 11px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .caption span {
        color: #d1e0cb;
        font-size: 12px;
      }
      .caption b {
        font-size: 15px;
      }
      .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        background: #17261d;
        color: #d2e6bb;
        padding: 20px;
      }
      .loading[hidden] {
        display: none;
      }
      .transport {
        margin: 12px 0 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .transport button {
        white-space: nowrap;
        min-width: 63px;
        font-weight: 700;
      }
      .transport input[type="range"] {
        width: 100%;
        min-width: 40px;
        accent-color: #cde98d;
      }
      .time {
        font:
          13px/1.3 ui-monospace,
          monospace;
        white-space: nowrap;
      }
      .muted,
      small {
        color: #aebfb1;
      }
      .transport select {
        padding: 5px;
      }
      aside {
        border: 1px solid #37483d;
        border-radius: 9px;
        padding: 17px 15px 15px;
        align-self: start;
        background: #152019;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 12px;
        letter-spacing: 0.035em;
      }
      .cameras {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .cameras button {
        padding: 8px 4px;
        font-size: 14px;
      }
      .rule {
        border-top: 1px solid #37483b;
        margin-top: 16px;
        padding-top: 13px;
      }
      .target {
        width: 100%;
        padding: 7px;
        margin: 6px 0 8px;
      }
      .checks {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        color: #d1dccc;
        font-size: 13px;
      }
      input[type="checkbox"] {
        accent-color: #cde98d;
        vertical-align: middle;
      }
      #hint {
        display: block;
        min-height: 36px;
        color: #a5b6a9;
        font-size: 12px;
        margin-top: 9px;
      }
      .chapters {
        margin-top: 20px;
        border-top: 1px solid #35453a;
        padding-top: 16px;
      }
      .chapters h2 {
        margin-bottom: 9px;
      }
      .cuegrid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 7px;
      }
      .cuegrid button {
        text-align: start;
        font-size: 13px;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 9px;
      }
      .cuegrid button span {
        font:
          11px ui-monospace,
          monospace;
        color: #a6b9a9;
      }
      .cuegrid button[aria-current="true"] {
        border-color: #9bb86d;
        color: #dbefac;
      }
      .feeds {
        margin-top: 18px;
        border-top: 1px solid #36453b;
        padding-top: 12px;
        color: #bdccbf;
      }
      .feeds summary {
        width: fit-content;
        font-weight: 600;
        color: #dae6d9;
      }
      .feeds p {
        margin: 8px 0;
        font-size: 13px;
      }
      .feedrow {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .feedrow input {
        padding: 7px 9px;
        width: min(380px, 100%);
      }
      .feedrow button {
        font-size: 13px;
      }
      .license {
        font-size: 12px;
      }
      .license pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 200px;
        overflow: auto;
      }
      .error {
        color: #ffd9a9;
      }
      @media (min-width: 1500px) {
        .layout {
          grid-template-columns: minmax(0, 1fr) 300px;
        }
        .field {
          max-height: 70vh;
        }
      }
      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        aside {
          display: grid;
          grid-template-columns: 1.15fr 1fr;
          gap: 14px 22px;
        }
        .rule {
          margin: 0;
          padding: 0;
          border: none;
        }
        .cameras {
          grid-template-columns: repeat(3, 1fr);
        }
        .cuegrid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (max-width: 600px) {
        header .wrap {
          height: 54px;
        }
        .en {
          font-size: 9px;
        }
        .brand {
          gap: 8px;
        }
        .signal {
          font-size: 11px;
        }
        main.wrap {
          padding-block: 13px 22px;
        }
        .field {
          aspect-ratio: 4/3;
        }
        .label,
        .caption {
          left: 8px;
        }
        .label {
          top: 8px;
        }
        .full {
          right: 8px;
          top: 8px;
        }
        .caption {
          bottom: 8px;
        }
        .transport {
          gap: 6px;
        }
        .time {
          font-size: 11px;
        }
        .transport button {
          min-width: 55px;
          padding: 5px;
        }
        .transport select {
          font-size: 12px;
        }
        aside {
          display: block;
          padding: 12px;
        }
        .rule {
          margin-top: 12px;
        }
        .cuegrid {
          grid-template-columns: repeat(3, 1fr);
        }
        .cuegrid button {
          gap: 5px;
          font-size: 12px;
          padding: 6px;
        }
        .checks {
          gap: 12px;
        }
        #hint {
          min-height: 0;
        }
        .target {
          margin-block: 4px;
        }
        .chapters {
          margin-top: 14px;
        }
        .feedrow input {
          width: 100%;
        }
      }
      [hidden] {
        display: none !important;
      }
      .sources {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .sourceButtons {
        display: flex;
        gap: 6px;
      }
      .sourceButtons button {
        font-size: 13px;
      }
      .feedPanel {
        border: 1px solid #405147;
        border-radius: 7px;
        background: #17241b;
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .feedPanel p {
        font-size: 12px;
        color: #becdbf;
        margin: 6px 0 0;
      }
      .feedPanel label {
        font-size: 13px;
      }
      #quality {
        font-size: 12px;
        color: #cfdfb5;
      }
      #media form {
        margin-top: 10px;
      }
      #media video {
        width: min(720px, 100%);
        margin-top: 8px;
        background: #111;
        max-height: 55vh;
      }
      .signal {
        text-align: right;
      }
      .transport button {
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <div class="brand">
          <i class="mark" aria-hidden="true"></i>场迹
          <span class="en">PITCHTRACE 3D</span>
        </div>
        <div class="signal" id="signal">内置演示</div>
      </div>
    </header>
    <main class="wrap">
      <div class="sources">
        <div class="sourceButtons" role="group" aria-label="画面来源">
          <button id="demo" aria-pressed="true">内置演示</button
          ><button id="sourceLive" aria-expanded="false" aria-controls="feed">
            连接直播
          </button>
        </div>
        <small id="quality"></small>
      </div>
      <section class="feedPanel" id="feed" aria-label="直播连接" hidden>
        <form class="feedrow" id="feedform">
          <label for="address">数据源</label
          ><input
            type="url"
            id="address"
            aria-label="WebSocket 数据地址"
            required
          /><button type="submit">连接数据</button
          ><button type="button" id="sample">本机试播</button>
        </form>
        <p id="netstatus" role="status">
          输入比赛的 WebSocket 地址，或连接本地模拟数据流。
        </p>
      </section>
      <div class="layout">
        <section aria-label="比赛画面">
          <div class="field" id="stage">
            <canvas
              id="pitch"
              aria-label="三维足球场，多机位互动比赛画面"
            ></canvas>
            <div class="overlay label" id="cameraTitle">自动导播</div>
            <button class="full" id="full">全屏</button>
            <div class="overlay caption">
              <b id="event">地面传球</b><span id="subject"></span>
            </div>
            <div class="loading" id="loading" role="status">
              正在载入球员、动作与球场…
            </div>
          </div>
          <div class="transport">
            <button class="primary" id="play" disabled>暂停</button
            ><span class="time" id="clock">00:00</span
            ><input
              type="range"
              id="seek"
              min="0"
              max="60"
              step=".01"
              value="0"
              aria-label="比赛进度"
            /><span class="time muted" id="duration">01:00</span
            ><select id="speed" aria-label="播放速度">
              <option value=".5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </div>
        </section>
        <aside>
          <div>
            <h2>观看机位</h2>
            <div class="cameras" id="cameras"></div>
            <small id="hint"></small>
          </div>
          <div class="rule">
            <label for="target">跟随球员</label
            ><select class="target" id="target">
              <option value="">自动跟随动作球员</option>
            </select>
            <div class="checks">
              <label><input type="checkbox" id="bones" /> 显示骨骼</label
              ><label id="loopControl"
                ><input type="checkbox" id="loop" /> 循环播放</label
              >
            </div>
          </div>
        </aside>
      </div>
      <section class="chapters" id="demoTimeline">
        <h2>动作时间轴</h2>
        <div class="cuegrid" id="chapters"></div>
      </section>
      <details class="feeds" id="media" hidden>
        <summary>实拍视频</summary>
        <form class="feedrow" id="mediaForm">
          <input
            id="mediaAddress"
            aria-label="HLS 播放列表地址"
            type="url"
            placeholder="https://…/index.m3u8"
            required
          /><button>播放实拍</button
          ><button type="button" id="mediaStop" hidden>关闭视频</button>
        </form>
        <p id="mediaStatus" role="status"></p>
        <video id="video" controls muted playsinline hidden></video>
      </details>
      <details class="feeds license">
        <summary>素材与许可</summary>
        <p>
          球员身体、足球动作及场地来自 soccerviewer /
          GameplayFootball。头颈网格改编自 Innerscene / MakeHuman
          足球运动员，使用 Three.js 渲染。
        </p>
        <pre>__LICENSES__</pre>
      </details>
    </main>
    __ASSETS__
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
