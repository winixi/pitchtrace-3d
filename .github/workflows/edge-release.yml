name: 发布 PitchTrace Edge 离线 CLI 预览版

on:
  push:
    tags:
      - 'edge-v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: edge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 构建 arm64 发布包并验证离线样例
    if: ${{ !github.event.deleted }}
    runs-on: macos-15
    steps:
      - name: 检出标签对应的源码
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 设置 Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: 安装离线样例依赖
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 -m pip install --only-binary=:all: numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: 打包并从解压目录运行双机位样例
        run: bash edge/scripts/package-preview.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/edge-release"
      - name: 保存已验证的 ZIP 和 SHA-256 校验文件
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pitchtrace-edge-preview
          path: ${{ runner.temp }}/edge-release/
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  release:
    name: 上传附件并发布 GitHub 预发布
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出同一提交的发布脚本与说明
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 下载已验证的附件
        uses: actions/download-artifact@v8.0.2
        with:
          name: pitchtrace-edge-preview
          path: ${{ runner.temp }}/edge-release
      - name: 发布当前标签的预览版
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-edge-preview.sh "$RUNNER_TEMP/edge-release"

  update-readmes:
    name: 更新 main 上的中英文 README
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出本次发布的更新脚本
        uses: actions/checkout@v7.0.1
        with:
          path: edge-release-source
          persist-credentials: false
      - name: 检出 main
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/heads/main
          path: main-source
      - name: 核对预发布附件并提交两份 README
        working-directory: main-source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 ../edge-release-source/.github/scripts/update-edge-readmes.py "$GITHUB_REF_NAME"
